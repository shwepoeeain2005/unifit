name: UniFit site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export site data
        run: python maintenance/export-site.py

      - name: Audit local links
        run: python maintenance/check-links.py

      - name: Admission rule tests
        run: node maintenance/test_admission_rules.mjs
